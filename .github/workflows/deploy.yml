name: Deploy Laravel Application

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, tag o rama a desplegar (rollback)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Debe coincidir con la version de PHP del hosting
  PHP_VERSION: "8.4"
  NODE_VERSION: "24"
  DEPLOY_REF: ${{ inputs.ref || github.sha }}

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, pdo_mysql, bcmath, fileinfo, intl, sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Composer Cache Directory
        id: composer-cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Dependencies (with dev)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Security audit
        run: composer audit

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: Pest (tests)
        run: php artisan test

  deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Reducimos el tiempo porque el ZIP es muy rápido
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, pdo_mysql, bcmath, fileinfo, intl, zip
          tools: composer:v2
          coverage: none

      - name: Composer Cache Directory
        id: composer-cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Prepare Deployment Files
        run: |
          # 1. Empaquetar todo el proyecto (esto incluye tu .htaccess original y seguro)
          zip -r build.zip . -x "*.git*" "*node_modules*" "tests*" "*.env*" "*.github*" "*.vscode*" "storage/logs/*"

          # 2. Crear el script de descompresión directamente en la raíz
          cat << 'EOF' > deploy.php
          <?php
          $zip = new ZipArchive;
          if ($zip->open(__DIR__ . '/build.zip') === TRUE) {
              $zip->extractTo(__DIR__);
              $zip->close();
              unlink(__DIR__ . '/build.zip');
              unlink(__FILE__);
              echo "Despliegue completado con exito.";
          } else {
              http_response_code(500);
              echo "Error al abrir el archivo ZIP.";
          }
          ?>
          EOF

          # 3. Crear un .htaccess temporal para evitar que el servidor nos redirija a Laravel
          echo "RewriteEngine Off" > .htaccess

      - name: Upload ZIP via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          timeout: 120000
          server-dir: ./${{ secrets.SERVER_DIR }}/
          # Solo subimos los 3 archivos clave, evitando borrar nada en tu servidor
          exclude: |
            **
            !build.zip
            !deploy.php
            !.htaccess

      - name: Execute Extraction on Server
        run: |
          echo "Ejecutando descompresión en la raíz..."
          # Hacemos la petición directa a la raíz, que ahora está temporalmente liberada
          HTTP_STATUS=$(curl -s -L -w "%{http_code}" https://${{ secrets.APP_DOMAIN }}/deploy.php -o response.txt)
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            cat response.txt
            echo -e "\n¡Despliegue finalizado con éxito!"
          else
            echo "Error HTTP: $HTTP_STATUS"
            cat response.txt
            exit 1
          fi